[build-system]
requires = [ "setuptools>=41", "wheel", "setuptools-git-versioning<4,>=3.0", ]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true
version_file = "horizon/VERSION"
count_commits_from_version_file = true
dev_template = "{tag}.dev{env:GITHUB_RUN_ID:{ccount}}+git.{sha}"
dirty_template = "{tag}.dev{env:GITHUB_RUN_ID:{ccount}}+git.{sha}.dirty"

[project]
name = "data-horizon"
license = {text = "Apache-2.0"}
description = "Horizon REST API + client"
authors = [{name= "MWS Data Bridge", email = "onetools@mts.ru"}]
readme = "README.rst"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pydantic :: 2",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["Horizon", "REST", "API", "HWM"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "typing-extensions>=4.0.0",
    "authlib>=1.0,<2.0",
]
dynamic = ["version"]

[tool.setuptools.packages.find]
include = ["horizon*"]
exclude = ["mddocs", "tests"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.ini", "VERSION"]

[project.urls]  # Optional
"Homepage" = "https://github.com/MTSWebServices/horizon"
"Documentation" = "https://data-horizon.readthedocs.io/"
"Source" = "https://github.com/MTSWebServices/horizon"
"CI/CD" = "https://github.com/MTSWebServices/horizon/actions"
"Tracker" = "https://github.com/MTSWebServices/horizon/issues"


[project.optional-dependencies]
backend = [
    "pydantic-settings",
    "pydantic-settings-logging",
    "fastapi>=0.103.2",
    "starlette",
    "python-multipart",
    "anyio",
    "starlette-exporter",
    "uvicorn",
    "alembic",
    "sqlalchemy>=2.0",
    "sqlalchemy-utils",
    "greenlet>=3.1.1",
    "asgi-correlation-id",
    "python-json-logger",
    "coloredlogs",
    "pyyaml",
    "uuid6",
    "devtools",
    "passlib",
]
postgres = [
    "asyncpg",
]
client-sync = [
    "requests",
    "urllib3>=1.26.0",
]
ldap = [
    "bonsai>=1.5.3",
    "argon2-cffi",
]

[dependency-groups]
# pytest-lazy-fixture doesn't support pytest 8.x+
test = [
  "pytest~=9.1.1",
  "httpx2>=2.10,<2.13",
  "pytest-asyncio~=1.4.0",
  "pytest-randomly>=4.1,<5.1",
  "pytest-rerunfailures~=16.4",
  "pytest-deadfixtures~=3.1.0",
  "pytest-lazy-fixtures~=1.4.0",
  "pytest-clarity~=1.0.1",
  "pytest-pretty~=1.3.0",
  "coverage>=7.15.2,<7.17.0",
  "psycopg2-binary~=2.9.12",
  "gevent~=26.7",
  "responses~=0.26.2",
]
dev = [
  "mypy~=2.3.0",
  "prek>=0.4.12,<0.6.0",
  "ruff~=0.16.2",
  "sqlalchemy[mypy]~=2.0.51",
  "types-pyyaml~=6.0.12",
  "types-authlib>=1.7.2,<1.9.0",
  "types-passlib~=1.7.7",
  "types-requests~=2.33.0",
]
mddocs = [
  "mkdocs~=1.6.1",
  "mkdocs-material~=9.7.6",
  "mkdocstrings[python]~=1.0.3",
  "mkdocs-autorefs~=1.4.4",
  "pymdown-extensions~=11.0",
  "griffe-inherited-docstrings~=1.1.3",
  "griffe-fieldz~=0.5.0",
  "mkdocs-literate-nav~=0.6.1",
  "mkdocs-git-revision-date-localized-plugin~=1.5.3",
  "mkdocs-towncrier~=0.1.5",
  "towncrier~=25.8.0",
]

[tool.uv]
default-groups = []

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.10"}
mddocs = {requires-python = ">=3.10"}


[tool.pytest.ini_options]
markers = [
    "backend: tests for backend (require running database)",
    "client: tests for horizon-client (require running database and backend)",
    "client_sync: tests for HorizonClientSync (using requests)",
    "auth: tests using AuthProvider",
    "dummy_auth: tests for DummyAuthProvider",
    "ldap_auth: tests for LDAPAuthProvider",
]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore:Module already imported so cannot be rewritten:pytest.PytestAssertRewriteWarning",
]

[tool.coverage.paths]
source = ["horizon"]

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
concurrency = ["gevent"]
omit = [
  "tests/*",
]
data_file = "reports/.coverage"

[tool.coverage.report]
precision = 2
exclude_also = [
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
  "\\.\\.\\.",
  "def downgrade\\(\\)",
]
partial_also = [
  "if TYPE_CHECKING:",
  "if .*isEnabledFor.*:",
  "if .*debug.*:",
  "if .*sys.version_info.*:",
  "if __name__ == .__main__.:",
]
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["mddocs/", "Makefile"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ARG", "ANN", "D", "COM812", "TD", "FIX002", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"horizon/commons/schemas/*" = ["TC"]
"horizon/backend/middlewares/*" = ["TC"]
"horizon/backend/db/repositories/*" = ["TC"]
"horizon/backend/db/migrations/*" = ["INP001", "E501"]
"horizon/backend/providers/auth/*" = ["PLR0913"]
# Conflict with generating openapi scheme for docs in ci
"horizon/backend/services/uow.py" = ["FA102"]

"tests/*" = ["S", "A", "PLR0913", "PLR2004", "FBT001", "SLF001", "PLR0917"]
"tests/*/fixtures/*" = ["INP001"]
"tests/fixtures/*" = ["INP001"]
"mddocs/scripts/*" = ["T201", "INP001", "C901", "PLR0915", "PLR0912", "E501"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "list"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.flake8-errmsg]
max-string-length=20

[tool.codespell]
exclude-file = "uv.lock"
ignore-words-list = "selectin"

[tool.mypy]
python_version="3.10"

[[tool.mypy.overrides]]
module = "pydantic_settings_logging"
ignore_missing_imports = true

[tool.towncrier]
name = "Horizon"
package = "horizon"
filename = "mddocs/docs/changelog/RELEASE_TEMPLATE.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
directory = "mddocs/docs/changelog/next_release/"
title_format = "# {version} ({project_date}) {{ #{version} }}"
issue_format = "[#{issue}](https://github.com/MTSWebServices/horizon/issues/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "significant"
name = "Significant Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "improvement"
name = "Improvements"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "dependency"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Doc only Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removal"
showcontent = true
